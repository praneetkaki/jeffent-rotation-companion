<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENT Rotation Companion</title>
  <meta name="description" content="An open, active-recall study tool for the Otolaryngology clinical rotation, built by and for JeffENT.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f3e17">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JeffENT">
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" data-tip="Menu" aria-label="Toggle navigation menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <button class="icon-btn nav-back" id="navBack" data-tip="Back" aria-label="Back to previous screen" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <div class="brand" id="brandHome" role="button" tabindex="0" aria-label="Go to home">
      <span class="mark" aria-hidden="true">
        <svg class="brand-mark" viewBox="0 0 120 120" width="32" height="32" fill="none"><defs><linearGradient id="jeffentMarkTopbar" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--primary)"/></linearGradient></defs><path d="M46 96c-8-8-14-18-14-34 0-22 14-38 32-38s30 14 30 32c0 14-8 20-14 26-5 5-4 12-12 12-6 0-8-4-8-8M52 62c0-9 6-16 13-16s12 6 12 13c0 8-6 10-9 14" stroke="url(#jeffentMarkTopbar)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 50c-4 8-4 16 0 24M8 42c-8 12-8 28 0 40" stroke="currentColor" style="color:var(--accent)" stroke-width="3.5" stroke-linecap="round" opacity=".7"/></svg>
      </span>
      <div class="brand-text">
        <div class="brand-name"><strong>ENT Rotation</strong> Companion<span id="connBadge" class="conn-dot" role="status" aria-live="polite" aria-label="Online" title="Online"></span></div>
      </div>
    </div>
    <div class="tb-right">
      <div class="search-wrap">
        <input id="searchInput" class="search-input mono" type="text" placeholder="Search topics…" autocomplete="off" spellcheck="false" aria-label="Search topics, anatomy, cases, and cards">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="search-kbd mono" aria-hidden="true">&#8984;K</span>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <div class="icon-cluster">
        <button class="icon-btn mobile-search-toggle" id="mobileSearchToggle" data-tip="Search" aria-label="Toggle search" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn pimp-toggle" id="pimpToggle" data-tip="Frequently asked questions" aria-label="Toggle frequently asked questions panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5-10-5Z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>
        </button>
        <button class="icon-btn" id="pocketLogTab" data-tip="OR Pocket Log" aria-label="Open OR Pocket Log" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        </button>
        <button class="icon-btn flash-toggle" id="flashToggle" data-tip="Flashcards (⌘⇧F)" aria-label="Toggle flashcards panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v9"/></svg>
        </button>
        <div class="settings-wrap">
          <button class="icon-btn" id="settingsToggle" data-tip="Settings" aria-label="Study settings" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-3.8l-.4 2.6a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.6h3.8l.4-2.6a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13Z"/></svg>
          </button>
          <div id="settingsPanel" class="settings-panel" hidden></div>
        </div>
        <button class="icon-btn" id="shortcutsToggle" data-tip="Keyboard shortcuts (?)" aria-label="Show keyboard shortcuts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9.5 14h5"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" data-tip="Theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div id="scrollProgress" class="scroll-progress-bar" aria-hidden="true"></div>

  <main id="main" class="wrap">
    <!-- screens injected by app.js -->
    <section id="screen-welcome" class="screen"></section>
    <section id="screen-home" class="screen" hidden></section>
    <section id="screen-track" class="screen" hidden></section>
    <section id="screen-module" class="screen" hidden></section>
    <section id="screen-study" class="screen" hidden></section>
    <section id="screen-pimp" class="screen" hidden></section>
    <section id="screen-roadmap" class="screen" hidden></section>
    <section id="screen-library" class="screen" hidden></section>
    <section id="screen-weak" class="screen" hidden></section>
    <section id="screen-about" class="screen" hidden></section>
  </main>

  <button type="button" id="backToTop" class="back-to-top" aria-label="Back to top" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <footer class="foot">
    <div class="wrap">
      <p class="mono">ENT Rotation Companion · <span id="moduleStamp"></span></p>
    </div>
  </footer>

  <script src="content/pediatric.js?v=20260923a"></script>

       stays inert with zero effect on the app until firebase-config.js is filled in -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260921a"></script>
  <script src="js/sync.js?v=20260921a"></script>
  <!-- engine + app -->
  <script src="js/srs.js?v=20260923b"></script>
  <script src="js/app.js?v=20261006e"></script>
  <script>
    // Registers the PWA service worker (see sw.js). Silently no-ops on
    // browsers without support or when served over plain http (not
    // localhost) since service workers require a secure context.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
