<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENT Rotation Companion</title>
  <meta name="description" content="An open, active-recall study tool for the Otolaryngology clinical rotation, built by and for JeffENT.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/styles.css?v=20260910e">
</head>
<body class="on-home">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" data-tip="Menu" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    <div class="brand" id="brandHome" role="button" tabindex="0" aria-label="Go to home">
      <span class="mark" aria-hidden="true">
        <img src="assets/logo.png" alt="" width="46" height="46">
      </span>
      <div>
        <div class="brand-name">ENT Rotation Companion</div>
        <div class="brand-sub mono">active recall · spaced repetition</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="search-wrap">
        <input id="searchInput" class="search-input mono" type="text" placeholder="⌕  Search topics…" autocomplete="off" spellcheck="false" aria-label="Search topics, anatomy, cases, and cards">
        <span class="search-kbd mono" aria-hidden="true">&#8984;K</span>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <button class="icon-btn pimp-toggle" id="pimpToggle" data-tip="Frequently asked questions" aria-label="Open frequently asked questions quiz">🎓</button>
      <button class="icon-btn flash-toggle" id="flashToggle" data-tip="Flashcards" aria-label="Toggle flashcards panel" aria-expanded="false">🗂</button>
      <div class="settings-wrap">
        <button class="icon-btn" id="settingsToggle" data-tip="Settings" aria-label="Study settings" aria-haspopup="true" aria-expanded="false">⚙</button>
        <div id="settingsPanel" class="settings-panel" hidden></div>
      </div>
      <button class="icon-btn" id="themeToggle" data-tip="Theme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- screens injected by app.js -->
    <section id="screen-home" class="screen"></section>
    <section id="screen-track" class="screen" hidden></section>
    <section id="screen-module" class="screen" hidden></section>
    <section id="screen-study" class="screen" hidden></section>
    <section id="screen-pimp" class="screen" hidden></section>
    <section id="screen-roadmap" class="screen" hidden></section>
    <section id="screen-about" class="screen" hidden></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p class="mono">ENT Rotation Companion · <span id="moduleStamp"></span></p>
      <p class="disclaimer">Draft pending Faculty review</p>
    </div>
  </footer>

  <!-- content modules register onto window.JEFFENT -->
  <script src="content/registry.js?v=20260910e"></script>
  <script src="content/frameworks.js?v=20260910e"></script>
  <script src="content/ukmla.js?v=20260910e"></script>
  <script src="content/tracks.js?v=20260910e"></script>
  <script src="content/ent-exam-clinic-complaints.js?v=20260910e"></script>
  <script src="content/otology.js?v=20260910e"></script>
  <script src="content/rhinology.js?v=20260910e"></script>
  <script src="content/laryngology.js?v=20260910e"></script>
  <script src="content/head-neck.js?v=20260910e"></script>
  <script src="content/pediatric.js?v=20260910e"></script>
  <script src="content/sleep.js?v=20260910e"></script>
  <script src="content/facial-plastics.js?v=20260910e"></script>
  <script src="content/emergencies.js?v=20260910e"></script>
  <script src="content/anatomy-atlas.js?v=20260910e"></script>
  <script src="content/pimp-questions.js?v=20260910e"></script>
  <script src="content/procedures.js?v=20260910e"></script>
  <script src="content/pharmacology.js?v=20260910e"></script>
  <!-- engine + app -->
  <script src="js/srs.js?v=20260910e"></script>
  <script src="js/app.js?v=20260910e"></script>
</body>
</html>
