<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure Placement Review</title>
<style>
  :root { --ink:#0f172a; --ink-soft:#475569; --ink-faint:#94a3b8; --line:#e2e8f0; --surface:#fff; --ground:#f8fafc; --primary:#2563eb; --flag:#dc2626; --good:#059669; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:15px/1.5 -apple-system,system-ui,sans-serif; padding-bottom:120px; }
  header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 0 2px; }
  header p { margin:0; color:var(--ink-soft); font-size:13px; }
  .stats { font-size:13px; color:var(--ink-soft); font-family: ui-monospace, monospace; }
  .actions { display:flex; gap:8px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; }
  button.primary { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
  button.primary:hover { background:#1d4ed8; }
  button:hover { border-color:var(--ink-faint); }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  .filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .filters input[type=text] { flex:1 1 240px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .filters label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
  .module-group { margin-bottom:28px; }
  .module-group h2 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .module-group h2 .count { font-size:12px; color:var(--ink-faint); font-weight:400; font-family: ui-monospace, monospace; }
  .row { display:grid; grid-template-columns:96px 1fr 320px; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; align-items:start; }
  .row.flagged { border-color:var(--flag); background:#fef2f2; }
  .row.noted { border-color:var(--primary); }
  .thumb { width:96px; height:96px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:zoom-in; background:#eee; }
  .thumb-broken { width:96px; height:96px; display:flex; align-items:center; justify-content:center; background:#fef2f2; color:var(--flag); font-size:11px; text-align:center; border-radius:6px; border:1px solid var(--flag); }
  .meta { min-width:0; }
  .meta .kind { display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-family: ui-monospace, monospace; color:var(--primary); background:#eff6ff; border-radius:4px; padding:2px 6px; margin-bottom:4px; }
  .meta .ctx-title { font-weight:600; font-size:14px; }
  .meta .ctx-id { font-family: ui-monospace, monospace; font-size:11.5px; color:var(--ink-faint); }
  .meta .snippet { color:var(--ink-soft); font-size:12.5px; margin-top:4px; }
  .meta .src { font-family: ui-monospace, monospace; font-size:11px; color:var(--ink-faint); margin-top:6px; word-break:break-all; }
  .meta .credit { font-size:11.5px; color:var(--ink-faint); font-style:italic; margin-top:2px; }
  .edit { display:flex; flex-direction:column; gap:6px; }
  .edit label.flagrow { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--flag); font-weight:600; }
  .edit textarea { width:100%; min-height:52px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:12.5px; resize:vertical; }
  .edit textarea:focus { outline:2px solid var(--primary); border-color:var(--primary); }
  .lightbox { position:fixed; inset:0; background:rgba(15,23,42,.85); display:none; align-items:center; justify-content:center; z-index:100; cursor:zoom-out; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:92vw; max-height:92vh; border-radius:8px; background:#fff; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:200; }
  .toast.show { opacity:1; }
  @media (max-width:760px) { .row { grid-template-columns:72px 1fr; } .edit { grid-column:1/-1; } .thumb, .thumb-broken { width:72px; height:72px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Figure Placement Review</h1>
    <p>Every image currently wired into the app, grouped by module. Flag anything misplaced and note where it should go, then export and send back.</p>
  </div>
  <div class="actions">
    <span class="stats" id="statLine"></span>
    <button id="exportBtn" class="primary">Export corrections</button>
    <button id="copyBtn">Copy to clipboard</button>
    <button id="clearBtn">Clear all</button>
  </div>
</header>
<main>
  <div class="filters">
    <input type="text" id="searchBox" placeholder="Filter by filename, id, title, caption...">
    <label><input type="checkbox" id="flaggedOnly"> Flagged only</label>
  </div>
  <div id="groups"></div>
</main>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>
<div class="toast" id="toast"></div>

// stable per-row key
ROWS.forEach(function(r, i) { r._key = r.module_file + "|" + i + "|" + r.src; });

var STORE_KEY = "figreview.corrections.v1";
function loadCorrections() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; }
}
function saveCorrections(c) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(c)); } catch (e) {}
}
var corrections = loadCorrections();

function esc(s) { return String(s || "").replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

function groupBy(rows) {
  var groups = {};
  var order = [];
  rows.forEach(function(r) {
    if (!groups[r.module_title]) { groups[r.module_title] = []; order.push(r.module_title); }
    groups[r.module_title].push(r);
  });
  return { groups: groups, order: order };
}

function rowHtml(r) {
  var c = corrections[r._key] || {};
  var flagged = !!c.flagged;
  var note = c.note || "";
  var cls = "row" + (flagged ? " flagged" : (note ? " noted" : ""));
  var ctxLine = r.context_title ? esc(r.context_title) : (r.context_id ? esc(r.context_id) : "(no id/title found)");
  var idLine = r.context_id ? '<div class="ctx-id">id: ' + esc(r.context_id) + '</div>' : '';
  var snippet = r.front_snippet || r.caption || r.alt || "";
  return (
    '<div class="' + cls + '" data-key="' + esc(r._key) + '">' +
      '<img class="thumb" loading="lazy" src="../' + esc(r.src) + '" onerror="this.outerHTML=\'<div class=&quot;thumb-broken&quot;>missing file</div>\'">' +
      '<div class="meta">' +
        '<span class="kind">' + esc(r.kind) + '</span>' +
        '<div class="ctx-title">' + ctxLine + '</div>' +
        idLine +
        (snippet ? '<div class="snippet">' + esc(snippet.slice(0,140)) + '</div>' : '') +
        '<div class="src">' + esc(r.src) + '</div>' +
        (r.credit ? '<div class="credit">' + esc(r.credit) + '</div>' : '') +
      '</div>' +
      '<div class="edit">' +
        '<label class="flagrow"><input type="checkbox" class="flagbox" ' + (flagged ? "checked" : "") + '> This image is misplaced</label>' +
        '<textarea class="notebox" placeholder="Where should this actually go? (module / section / id)">' + esc(note) + '</textarea>' +
      '</div>' +
    '</div>'
  );
}

function render() {
  var q = document.getElementById("searchBox").value.trim().toLowerCase();
  var flaggedOnly = document.getElementById("flaggedOnly").checked;
  var filtered = ROWS.filter(function(r) {
    if (flaggedOnly) {
      var c = corrections[r._key];
      if (!c || !c.flagged) return false;
    }
    if (!q) return true;
    var hay = [r.src, r.context_id, r.context_title, r.caption, r.alt, r.front_snippet, r.module_title].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  });
  var g = groupBy(filtered);
  var root = document.getElementById("groups");
  var html = "";
  g.order.forEach(function(name) {
    var items = g.groups[name];
    html += '<div class="module-group"><h2>' + esc(name) + ' <span class="count">' + items.length + ' figures</span></h2>';
    items.forEach(function(r) { html += rowHtml(r); });
    html += '</div>';
  });
  root.innerHTML = html || '<p style="color:var(--ink-faint)">No matches.</p>';
  updateStats();
}

function updateStats() {
  var flaggedCount = Object.keys(corrections).filter(function(k){ return corrections[k].flagged; }).length;
  var notedCount = Object.keys(corrections).filter(function(k){ return corrections[k].note && !corrections[k].flagged; }).length;
  document.getElementById("statLine").textContent = ROWS.length + " total · " + flaggedCount + " flagged · " + notedCount + " noted";
}

document.getElementById("groups").addEventListener("click", function(e) {
  if (e.target.classList.contains("thumb")) {
    document.getElementById("lightboxImg").src = e.target.src;
    document.getElementById("lightbox").classList.add("open");
  }
  if (e.target.classList.contains("flagbox")) {
    var key = e.target.closest(".row").dataset.key;
    corrections[key] = corrections[key] || {};
    corrections[key].flagged = e.target.checked;
    if (!corrections[key].flagged && !corrections[key].note) delete corrections[key];
    saveCorrections(corrections);
    e.target.closest(".row").classList.toggle("flagged", e.target.checked);
    updateStats();
  }
});
document.getElementById("groups").addEventListener("input", function(e) {
  if (e.target.classList.contains("notebox")) {
    var key = e.target.closest(".row").dataset.key;
    corrections[key] = corrections[key] || {};
    corrections[key].note = e.target.value;
    if (!corrections[key].flagged && !corrections[key].note) delete corrections[key];
    saveCorrections(corrections);
    e.target.closest(".row").classList.toggle("noted", !!e.target.value && !corrections[key].flagged);
    updateStats();
  }
});
document.getElementById("lightbox").addEventListener("click", function() {
  this.classList.remove("open");
});
document.getElementById("searchBox").addEventListener("input", render);
document.getElementById("flaggedOnly").addEventListener("change", render);

function buildExport() {
  var out = [];
  ROWS.forEach(function(r) {
    var c = corrections[r._key];
    if (!c || (!c.flagged && !c.note)) return;
    out.push({
      module: r.module_title,
      context_id: r.context_id,
      context_title: r.context_title,
      kind: r.kind,
      current_image: r.src,
      flagged_misplaced: !!c.flagged,
      correction_note: c.note || ""
    });
  });
  return out;
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

document.getElementById("exportBtn").addEventListener("click", function() {
  var out = buildExport();
  if (!out.length) { showToast("Nothing flagged or noted yet"); return; }
  var blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "figure-corrections.json";
  document.body.appendChild(a); a.click(); a.remove();
  showToast("Downloaded " + out.length + " correction(s)");
});
document.getElementById("copyBtn").addEventListener("click", function() {
  var out = buildExport();
  if (!out.length) { showToast("Nothing flagged or noted yet"); return; }
  var text = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(text).then(function() {
    showToast("Copied " + out.length + " correction(s) to clipboard");
  }, function() {
    showToast("Copy failed, use Export instead");
  });
});
document.getElementById("clearBtn").addEventListener("click", function() {
  if (!confirm("Clear all flags and notes on this page? (Nothing already exported is affected.)")) return;
  corrections = {};
  saveCorrections(corrections);
  render();
});

render();
</script>
</body>
</html>
